<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e5"><title>轻循 · 顺着身体，慢慢变轻</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="轻循">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="app">
    <p id="storage-alert" class="storage-alert" role="alert" hidden></p>
    <div class="app-tools" aria-label="应用操作"><button type="button" class="install-link" data-install>＋ 添加到手机桌面</button><button type="button" class="update-button" data-update>更新 · v2</button></div>
    <main id="content"><p class="info">正在读取本机记录…</p></main>
    <nav aria-label="主导航">
      <button data-page="today" class="active"><span>⌂</span>今日</button>
      <button data-page="cycle"><span>❋</span>周期</button>
      <button data-page="record"><span>＋</span>记录</button>
      <button data-page="train"><span>♧</span>跟练</button>
      <button data-page="calendar"><span>▦</span>日历</button>
    </nav>
  </div>
  <dialog id="sheet"><form id="sheet-form"><div class="sheet-top"><span class="eyebrow">轻循 · 记录生活</span><button type="button" data-action="close" aria-label="关闭">×</button></div><div id="sheet-body"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="core.js"></script>
  <script src="storage.js"></script>
  <script src="config.js"></script>
  <script src="browser-app.js"></script>
  <script src="install.js"></script>
</body>
</html>
